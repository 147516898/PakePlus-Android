<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公寓租房管家 · 房源 / 租户 / 到期提醒</title>
<!-- SECTION: styles -->
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1b2437; --ink-2:#5a6579; --ink-3:#8b96ab;
  --line:#e4e8f1; --brand:#2f6bff; --brand-d:#1f4fd6; --brand-soft:#eaf0ff;
  --green:#12a06a; --green-soft:#e6f7ef; --orange:#e07b17; --orange-soft:#fdf1e0;
  --red:#d93a3a; --red-soft:#fdecec; --gray-soft:#eef1f6; --radius:16px;
  --shadow:0 1px 2px rgba(21,32,58,.05), 0 8px 24px rgba(21,32,58,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

/* SECTION: layout shell */
.app{max-width:1180px;margin:0 auto;padding:22px 20px 48px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,var(--brand),#6d9bff);color:#fff;display:grid;place-items:center;
  font-size:22px;box-shadow:0 6px 16px rgba(47,107,255,.3)}
.brand-txt h1{margin:0;font-size:20px;letter-spacing:.5px}
.brand-txt p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.today{font-size:13px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);
  padding:7px 12px;border-radius:10px}

/* SECTION: tabs */
.tabs{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);
  padding:6px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px;overflow-x:auto}
.tab{position:relative;border:0;background:transparent;color:var(--ink-2);
  padding:9px 16px;border-radius:10px;font-size:14.5px;cursor:pointer;white-space:nowrap;transition:.18s}
.tab:hover{background:var(--gray-soft);color:var(--ink)}
.tab.active{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(47,107,255,.28)}
.tab .dot{margin-left:6px;font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--red);color:#fff;display:none;align-items:center;justify-content:center;font-weight:700}
.tab.active .dot{background:rgba(255,255,255,.28)}

/* SECTION: stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow)}
.stat-k{font-size:12.5px;color:var(--ink-3);letter-spacing:.3px}
.stat-v{font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.stat-v.accent{color:var(--orange)}
.stat-v.money{color:var(--green)}

/* SECTION: panel & lists */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px}
.panel-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel-head h2{margin:0;font-size:17px}
.hint{font-size:12.5px;color:var(--ink-3)}
.done-toggle{margin-left:auto;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.rem-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rem{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:13px;
  border:1px solid var(--line);background:#fbfcff;transition:.15s}
.rem:hover{border-color:#cdd9f5}
.rem.rent,.rem.rent-overdue{background:linear-gradient(90deg,#fff8ef,#ffffff 45%)}
.rem.lease,.rem.lease-expired{background:linear-gradient(90deg,#eef3ff,#ffffff 45%)}
.rem.overdue{border-color:#f6cfcf}
.rem.is-done{opacity:.55}
.rem-ico{font-size:19px;line-height:1.3;flex:none}
.rem-body{flex:1;min-width:0}
.rem-title{font-weight:600;font-size:14.5px;word-break:break-word}
.rem-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.rem-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.rem-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
.chip-red{background:var(--red-soft);color:var(--red)}
.chip-orange{background:var(--orange-soft);color:var(--orange)}
.chip-green{background:var(--green-soft);color:var(--green)}
.chip-gray{background:var(--gray-soft);color:var(--ink-2)}

/* SECTION: buttons & inputs */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;
  padding:8px 14px;font-size:14px;cursor:pointer;transition:.15s}
.btn:hover{border-color:#c9d3e8;background:#f7f9ff}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.btn-ghost:hover{background:var(--gray-soft);color:var(--ink)}
.btn-danger-ghost{color:var(--red);border-color:transparent;background:transparent}
.btn-danger-ghost:hover{background:var(--red-soft);border-color:#f4d3d3}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.inp{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;
  font-size:14px;color:var(--ink);min-width:0;font-family:inherit}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search{flex:1;min-width:200px;max-width:340px}
.toolbar .btn-primary{margin-left:auto}

/* SECTION: house cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.h-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.h-code{font-weight:700;font-size:15px;letter-spacing:.5px}
.badge{font-size:11.5px;padding:3px 9px;border-radius:20px;font-weight:600}
.b-vacant{background:var(--gray-soft);color:var(--ink-2)}
.b-rented{background:var(--green-soft);color:var(--green)}
.b-maint{background:var(--orange-soft);color:var(--orange)}
.h-title{font-size:14px;color:var(--ink)}
.h-meta{font-size:12.8px;color:var(--ink-2)}
.h-note{font-size:12.5px;color:var(--ink-3);background:var(--gray-soft);padding:5px 9px;border-radius:8px}
.h-tenant{font-size:13px;margin-top:2px;padding-top:9px;border-top:1px dashed var(--line)}
.muted{color:var(--ink-3)}
.h-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* SECTION: tables */
.table-wrap{padding:0;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.8px;min-width:720px}
.tbl th{text-align:left;padding:12px 14px;color:var(--ink-3);font-weight:600;font-size:12.5px;
  background:#fafbfe;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#f8faff}
.td-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.td-money{font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.row-acts{display:flex;gap:6px;flex-wrap:wrap}

/* SECTION: empty state */
.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty-ico{font-size:34px;margin-bottom:8px}
.empty p{margin:0;font-size:14px}

/* SECTION: modal */
#modal-root:not(:empty) .mask{position:fixed;inset:0;background:rgba(20,28,48,.42);z-index:40;backdrop-filter:blur(2px)}
.modal{position:fixed;z-index:41;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(680px,calc(100vw - 32px));max-height:88vh;overflow:auto;background:var(--card);
  border-radius:18px;box-shadow:0 24px 60px rgba(15,25,50,.28)}
.modal-head{position:sticky;top:0;background:var(--card);padding:18px 20px 14px;font-size:16.5px;
  font-weight:700;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal .x{border:0;background:var(--gray-soft);width:30px;height:30px;border-radius:8px;
  cursor:pointer;color:var(--ink-2);font-size:14px}
.modal .x:hover{background:#e2e7f0;color:var(--ink)}
#m-form{padding:18px 20px 4px}
.frow{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.frow label{display:flex;flex-direction:column;gap:5px;font-size:12.8px;color:var(--ink-2);flex:1;min-width:130px}
.frow label.grow{flex:2;min-width:220px}
.f-tip{margin:2px 0 10px;font-size:12.5px;color:var(--ink-3);background:var(--brand-soft);
  padding:9px 12px;border-radius:10px}
.modal-foot{position:sticky;bottom:0;background:var(--card);padding:14px 20px 18px;
  display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}

/* SECTION: toast */
#toast{position:fixed;z-index:60;left:50%;bottom:26px;transform:translate(-50%,14px);
  background:#212c46;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.24s;max-width:88vw;box-shadow:0 10px 30px rgba(15,25,50,.32)}
#toast.show{opacity:1;transform:translate(-50%,0)}

.footnote{margin-top:22px;font-size:12.3px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.footnote button{border:0;background:none;color:var(--brand);cursor:pointer;font-size:12.3px;padding:0}
.footnote button:hover{text-decoration:underline}

/* SECTION: responsive */
@media (max-width:760px){
  .app{padding:16px 12px 40px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:13px 14px}
  .stat-v{font-size:21px}
  .grid{grid-template-columns:1fr}
  .rem{flex-wrap:wrap}
  .rem-right{width:100%;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .toolbar .btn-primary{margin-left:0;width:100%}
  .search{max-width:none}
  .today{display:none}
}
@media (max-width:420px){
  .stats{grid-template-columns:1fr 1fr}
  .tab{padding:8px 12px;font-size:13.5px}
}
</style>
</head>
<body>
<!-- SECTION: app-shell -->
<div class="app">
  <header class="topbar">
    <div class="logo">🏘️</div>
    <div class="brand-txt">
      <h1>公寓租房管家</h1>
      <p>房源台账 · 租户租约 · 到期前 3 天自动提醒</p>
    </div>
    <div class="topbar-right">
      <span class="today" id="today-txt">今天 2026-09-29</span>
    </div>
  </header>

  <nav class="tabs" aria-label="主导航">
    <button class="tab active" data-view="reminders">🔔 提醒中心<span class="dot" id="nav-badge"></span></button>
    <button class="tab" data-view="houses">🏠 房源管理</button>
    <button class="tab" data-view="tenants">👥 租户租约</button>
    <button class="tab" data-view="bills">🧾 收租记录</button>
  </nav>

  <main id="view-root"></main>

  <p class="footnote">
    <span>数据保存在当前浏览器本地，换设备或清理浏览器记录会回到示例数据。</span>
    <button data-action="reset-demo">重置为示例数据</button>
  </p>
</div>

<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- SECTION: scripts -->
<script src="assets/app-data.js"></script>
<script src="assets/app-view.js"></script>
<script src="assets/app-actions.js"></script>
<script>
/* 顶部日期：写入当天日期，供提醒口径核对 */
(function () {
  var el = document.getElementById('today-txt');
  if (el) el.textContent = '今天 ' + todayStr();
})();
</script>
</body>
</html>
